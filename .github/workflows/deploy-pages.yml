name: Déployer sur GitHub Pages

# Déploie le site statique (racine du dépôt) sur GitHub Pages.
# Prérequis (une seule fois) : Settings → Pages → Source : « GitHub Actions ».

on:
  push:
    branches:
      - main
      - claude/business-dashboard-site-ddck3q
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
